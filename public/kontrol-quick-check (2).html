<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONTROL Quick-Check | takeKONTROL</title>
<meta name="description" content="Der kostenlose 5-Minuten-Selbstcheck: Wie krisenfest sind Sie? 12 Fragen, sofortiges Ergebnis, konkrete nächste Schritte.">
<style>
  :root {
    /* Light Mode Palette */
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f7;
    --bg-header-blur: rgba(255, 255, 255, 0.85);
    
    --text-heading: #111111;
    --text-body: #333333;
    --text-muted: #737373;
    
    --brand-red: #b32020;
    --brand-red-hover: #8c1919;
    --brand-red-tint: rgba(179, 32, 32, 0.15);
    --status-green: #34A853;
    
    --border-color: #e5e5e5;
    --radius-corp: 14px;
    
    --shadow-base: 0 10px 30px rgba(0,0,0,0.06);
    --shadow-hover: 0 10px 30px var(--brand-red-tint);
    
    --font-stack: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  /* Logo Theme Toggles */
  .brand-icon-light { display: block; }
  .brand-icon-dark { display: none; }

  @media (prefers-color-scheme: dark) {
    :root {
      /* Dark Mode Palette */
      --bg-primary: #080808;
      --bg-secondary: #121212;
      --bg-header-blur: rgba(8, 8, 8, 0.85);
      
      --text-heading: #ffffff;
      --text-body: #f5f5f7;
      --text-muted: #a3a3a3;
      
      --brand-red: #d32f2f;
      --brand-red-hover: #b71c1c;
      --brand-red-tint: rgba(211, 47, 47, 0.15);
      
      --border-color: #222222;
      --shadow-base: 0 10px 30px rgba(0,0,0,0.4);
    }
    
    .brand-icon-light { display: none; }
    .brand-icon-dark { display: block; }
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  
  body {
    font-family: var(--font-stack);
    background: var(--bg-primary);
    color: var(--text-body);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s ease, color 0.3s ease;
  }

  h1, h2, h3, h4 {
    color: var(--text-heading);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .container {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Full Corporate Header ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-header-blur);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-color);
    transition: all 0.3s ease;
    padding: 16px 0;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .brand-icon {
    height: 32px;
    width: 32px;
    object-fit: contain;
    border-radius: 6px;
  }

  .logo-text {
    font-size: 20px;
    color: var(--text-heading);
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .logo-text strong { font-weight: 800; }

  .brand-logo .tag {
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--brand-red);
    text-transform: uppercase;
    background: var(--brand-red-tint);
    padding: 4px 8px;
    border-radius: 6px;
  }

  .main-nav {
    display: none;
    align-items: center;
    gap: 32px;
  }

  @media(min-width: 768px) {
    .main-nav { display: flex; }
  }

  .main-nav a {
    text-decoration: none;
    color: var(--text-heading);
    font-weight: 600;
    font-size: 14px;
    transition: color 0.2s ease;
  }
  .main-nav a:hover { color: var(--brand-red); }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .lang-toggle {
    display: flex;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-corp);
    overflow: hidden;
  }

  .lang-toggle button {
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .lang-toggle button.active {
    background: var(--brand-red);
    color: #ffffff;
  }

  .lang-toggle button:focus-visible {
    outline: 2px solid var(--brand-red);
    outline-offset: -2px;
  }

  /* ---------- Progress ---------- */
  .progress-wrap {
    padding: 32px 0 16px;
    display: none;
  }
  .progress-wrap.visible { display: block; }
  
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .progress-track {
    height: 6px;
    background: var(--bg-secondary);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--brand-red);
    border-radius: 99px;
    transition: width 0.35s ease;
  }

  /* ---------- Stage ---------- */
  main { flex: 1; display: flex; flex-direction: column; width: 100%; align-items: center; }
  
  .stage {
    max-width: 900px;
    width: 100%;
    padding: 24px 24px 80px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  
  .screen { animation: fadeUp 0.35s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- Intro ---------- */
  .intro { padding-top: 6vh; }
  
  .eyebrow {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-red);
    margin-bottom: 16px;
  }
  
  .intro h1 {
    font-size: clamp(38px, 6vw, 64px);
    line-height: 1.1;
    margin-bottom: 24px;
    max-width: 20ch;
  }
  
  .intro .lede {
    font-size: 18px;
    line-height: 1.6;
    color: var(--text-body);
    max-width: 60ch;
    margin-bottom: 32px;
  }
  
  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 40px;
  }
  
  .fact {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-heading);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-corp);
    padding: 8px 16px;
    background: var(--bg-secondary);
  }
  
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    border: none;
    border-radius: var(--radius-corp);
    cursor: pointer;
    padding: 16px 32px;
    transition: all 0.3s ease;
  }
  
  .btn-primary {
    background: var(--brand-red);
    color: #ffffff;
  }
  
  .btn-primary:hover {
    background: var(--brand-red-hover);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  
  .btn-dark {
    background: var(--text-heading);
    color: var(--bg-primary);
  }
  
  .btn-dark:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-base);
  }
  
  .btn-ghost {
    background: transparent;
    color: var(--text-heading);
    border: 1px solid var(--border-color);
  }
  
  .btn-ghost:hover {
    border-color: var(--brand-red);
    color: var(--brand-red);
  }
  
  .trust {
    margin-top: 24px;
    font-size: 14px;
    color: var(--text-muted);
  }
  
  .intro-areas {
    margin-top: 64px;
    border-top: 1px solid var(--border-color);
    padding-top: 32px;
  }
  
  .intro-areas p {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  
  .area-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    font-size: 16px;
    font-weight: 500;
    color: var(--text-heading);
  }
  
  .area-chips span::before {
    content: "•";
    color: var(--brand-red);
    margin-right: 8px;
    font-weight: 700;
  }

  /* ---------- Question ---------- */
  .question { position: relative; padding-top: 20px; }
  
  .ghost-num {
    position: absolute;
    top: -40px;
    right: 20px;
    font-size: clamp(80px, 15vw, 180px);
    font-weight: 700;
    color: var(--bg-secondary);
    line-height: 1;
    user-select: none;
    pointer-events: none;
    z-index: 0;
  }
  
  .q-cat {
    position: relative;
    z-index: 1;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-red);
    margin-bottom: 16px;
  }
  
  .q-text {
    position: relative;
    z-index: 1;
    font-size: clamp(24px, 4vw, 36px);
    line-height: 1.3;
    margin-bottom: 40px;
    max-width: 30ch;
  }
  
  .options {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .option {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text-body);
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-corp);
    box-shadow: var(--shadow-base);
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .option:hover {
    border-color: var(--brand-red);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  
  .option .dot {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border-color);
    transition: all 0.3s ease;
  }
  
  .option.selected {
    border-color: var(--brand-red);
    background: var(--brand-red-tint);
  }
  
  .option.selected .dot {
    border-color: var(--brand-red);
    background: var(--brand-red);
    box-shadow: inset 0 0 0 4px var(--bg-primary);
  }
  
  .q-nav {
    margin-top: 40px;
    position: relative;
    z-index: 1;
  }
  
  .back-link {
    background: none;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 0;
    transition: color 0.2s ease;
  }
  
  .back-link:hover { color: var(--text-heading); }

  /* ---------- Results ---------- */
  .score-hero {
    background: #060608;
    background: radial-gradient(circle at center, rgba(179,32,32,0.15) 0%, #060608 100%);
    color: #ffffff;
    padding: 80px 24px;
    text-align: center;
    border-radius: var(--radius-corp);
    box-shadow: var(--shadow-base);
    width: 100%;
  }
  
  .score-hero .eyebrow { color: var(--brand-red); margin-bottom: 32px; }
  
  .ring-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 40px;
  }
  
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 12; }
  
  .ring-fg {
    fill: none;
    stroke: var(--brand-red);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .ring-num {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  .ring-num .big {
    font-size: 72px;
    font-weight: 700;
    line-height: 1;
    color: #ffffff;
    letter-spacing: -0.02em;
  }
  
  .ring-num .of {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    margin-top: 8px;
  }
  
  .score-hero .level-name {
    font-size: clamp(32px, 5vw, 44px);
    margin-bottom: 16px;
    color: #ffffff;
  }
  
  .score-hero .level-desc {
    font-size: 18px;
    line-height: 1.6;
    max-width: 54ch;
    margin: 0 auto;
    color: rgba(255,255,255,0.8);
  }

  .results-body {
    padding: 64px 0 24px;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }
  
  .section-title {
    font-size: clamp(24px, 4vw, 32px);
    margin-bottom: 32px;
  }

  .cat-row { margin-bottom: 24px; }
  
  .cat-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  
  .cat-name { font-weight: 600; font-size: 16px; color: var(--text-heading); }
  
  .cat-pct {
    font-weight: 600;
    font-size: 14px;
    color: var(--text-muted);
  }
  
  .cat-track {
    height: 8px;
    background: var(--bg-secondary);
    border-radius: 99px;
    overflow: hidden;
  }
  
  .cat-fill {
    height: 100%;
    width: 0%;
    background: var(--text-heading);
    border-radius: 99px;
    transition: width 0.9s ease 0.3s;
  }
  
  .cat-row.weak .cat-fill { background: var(--brand-red); }
  .cat-row.weak .cat-pct { color: var(--brand-red); }

  .steps { margin-top: 64px; }
  
  .step-card {
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-corp);
    padding: 32px;
    margin-bottom: 16px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    box-shadow: var(--shadow-base);
  }
  
  .step-num {
    flex: 0 0 auto;
    font-size: 28px;
    font-weight: 700;
    color: var(--brand-red);
    line-height: 1;
  }
  
  .step-body h3 {
    font-size: 20px;
    margin-bottom: 12px;
  }
  
  .step-body p {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-body);
    margin-bottom: 0;
  }
  
  .step-shop {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-weight: 600;
    font-size: 14px;
    color: var(--brand-red);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  
  .step-shop:hover { color: var(--brand-red-hover); }

  .perfect-card {
    background: var(--bg-secondary);
    border: 1px solid var(--status-green);
    border-radius: var(--radius-corp);
    padding: 40px;
    text-align: center;
  }
  
  .perfect-card h3 { color: var(--status-green); margin-bottom: 12px; }

  .shop-cta {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-corp);
    padding: 48px 32px;
    margin-top: 64px;
    text-align: center;
  }
  
  .shop-cta h2 { margin-bottom: 16px; font-size: 24px; }
  .shop-cta p { font-size: 16px; line-height: 1.6; margin-bottom: 32px; color: var(--text-body); max-width: 500px; margin-inline: auto; }

  .result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin: 48px 0 32px;
  }

  /* ---------- Full Corporate Footer ---------- */
  .site-footer {
    border-top: 1px solid var(--border-color);
    padding: 64px 0 32px;
    background: var(--bg-secondary);
  }

  .footer-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 48px;
    margin-bottom: 48px;
  }

  .footer-col h4 {
    font-size: 16px;
    margin-bottom: 24px;
  }

  .footer-col-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .footer-col p {
    color: var(--text-muted);
    line-height: 1.6;
    margin-top: 16px;
    font-size: 14px;
    max-width: 300px;
  }

  .footer-links {
    list-style: none;
  }
  
  .footer-links li {
    margin-bottom: 12px;
  }

  .footer-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s ease;
  }

  .footer-links a:hover {
    color: var(--brand-red);
  }

  .footer-bottom {
    border-top: 1px solid var(--border-color);
    padding-top: 32px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  
  .footer-bottom a {
    color: var(--text-heading);
    font-weight: 600;
    text-decoration: none;
  }

  @media (max-width: 768px) {
    .footer-grid { grid-template-columns: 1fr; gap: 32px; }
    .option { font-size: 15px; padding: 16px; }
    .btn { width: 100%; }
    .result-actions .btn { width: auto; flex: 1; }
    .score-hero { border-radius: 0; padding: 48px 20px; }
    .step-card { flex-direction: column; gap: 16px; }
  }

  /* ── Product recommendation modal ─────────────────────────── */
  #rec-modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 9000;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    align-items: flex-end;
    justify-content: center;
    padding: env(safe-area-inset-bottom, 0);
  }
  #rec-modal-overlay.open {
    display: flex;
    animation: overlayFadeIn .25s ease forwards;
  }
  @keyframes overlayFadeIn { from{opacity:0} to{opacity:1} }

  #rec-modal {
    background: var(--bg-primary);
    width: 100%; max-width: 680px;
    border-radius: 20px 20px 0 0;
    max-height: 90vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.32,1,.53,1);
    padding: 0 0 env(safe-area-inset-bottom, 20px);
  }
  #rec-modal-overlay.open #rec-modal { transform: translateY(0); }

  @media (min-width: 680px) {
    #rec-modal-overlay { align-items: center; }
    #rec-modal { border-radius: 20px; max-height: 85vh; }
  }

  .rec-modal__drag {
    width: 40px; height: 4px; border-radius: 2px;
    background: var(--border-color);
    margin: 12px auto 0;
  }
  .rec-modal__head {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 20px 24px 0;
    gap: 12px;
  }
  .rec-modal__title { font-size: 17px; font-weight: 700; color: var(--text-heading); margin: 0; }
  .rec-modal__sub   { font-size: 13px; color: var(--text-muted); margin: 4px 0 0; }
  .rec-modal__close {
    flex: 0 0 auto;
    background: var(--bg-secondary); border: none; cursor: pointer;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 18px; line-height: 1;
    transition: background .15s;
  }
  .rec-modal__close:hover { background: var(--border-color); }

  .rec-modal__body {
    padding: 16px 24px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }

  /* ── product card inside modal ─────── */
  .rec-card {
    display: flex; gap: 14px;
    border: 1px solid var(--border-color);
    border-radius: 14px; overflow: hidden;
    background: var(--bg-secondary);
    transition: border-color .2s, box-shadow .2s;
    position: relative;
  }
  .rec-card:first-child {
    border-color: var(--brand-red);
    box-shadow: 0 0 0 1px var(--brand-red);
  }
  .rec-card:first-child::before {
    content: attr(data-pick);
    position: absolute; top: 0; left: 0;
    background: var(--brand-red); color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 0 0 8px 0;
  }
  .rec-card__img {
    flex: 0 0 100px; width: 100px;
    background: var(--bg-primary);
    display: flex; align-items: center; justify-content: center;
    padding: 10px;
  }
  .rec-card__img img {
    width: 100%; height: 80px; object-fit: contain;
  }
  .rec-card__body {
    flex: 1; padding: 14px 14px 14px 0;
    display: flex; flex-direction: column; justify-content: space-between;
    gap: 6px;
  }
  .rec-card__tier {
    font-size: 10px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .rec-card__name { font-size: 15px; font-weight: 700; color: var(--text-heading); }
  .rec-card__why {
    font-size: 12px; line-height: 1.45; color: var(--text-body);
    padding: 6px 10px;

/** computeScore (score.js logic):
 *  answer values 0–3 → mapped to 0–2 scale.
 *  Per-category score 0–100, overall = mean of categories. */
function computeScore(rawAnswers) {
  const catTotals = {};
  const catCounts = {};
  Object.keys(CATS).forEach(k => { catTotals[k] = 0; catCounts[k] = 0; });

  QUESTIONS.forEach((q, i) => {
    const raw = rawAnswers[i] ?? 0;
    const pts = ANSWER_MAP[q[lang].opts[raw][1]] ?? 0;  // 0-2
    catTotals[q.cat] += pts;
    catCounts[q.cat]++;
  });

  const categories = {};
  Object.keys(CATS).forEach(k => {
    const max = catCounts[k] * 2;
    categories[k] = max > 0 ? Math.round((catTotals[k] / max) * 100) : 0;
  });

  const overall = Math.round(
    Object.values(categories).reduce((a, b) => a + b, 0) / Object.keys(categories).length
  );
  return { categories, overall };
}

/** levelFor — finds matching SCORE_LEVELS entry */
function levelFor(overall) {
  return SCORE_LEVELS.find(l => overall <= l.max) || SCORE_LEVELS[SCORE_LEVELS.length - 1];
}

/** weakestCategories — bottom n categories by score */
function weakestCategories(categories, n = 3) {
  return Object.entries(categories).sort((a, b) => a[1] - b[1]).slice(0, n);
}

    sku:'TK-BP-STD', price:'€273.69', img:'assets/img/standard-bagpack.png', badge:'standard',
    name:{de:'Standard Rucksack',en:'Standard Backpack'},
    desc:{de:'Alle Essential-Inhalte plus Notfallradio, Kartensatz und Dokumentenschutz.',en:'All Essential contents plus emergency radio, road maps and document protection.'},
    coversCats:['09','03','06','05','07','08'], anchor:'#backpacks',
  },
  'TK-BP-PRM': {
    sku:'TK-BP-PRM', price:'€594.99', img:'assets/img/04_ready_to_leave.png', badge:'premium',
    name:{de:'Premium Rucksack',en:'Premium Backpack'},
    desc:{de:'Volle Eigenständigkeit: Solar-Powerbank, Wasserfilter, Atemschutz, Werkzeug-Kit.',en:'Full self-sufficiency: solar power bank, water filter, respiratory protection, full toolkit.'},
    coversCats:['01','02','03','04','05','06','07','08','09'], anchor:'#backpacks',
  },
  'TK-HOME-7D': {
    sku:'TK-HOME-7D', price:'€549.99', img:'assets/img/essential-bagpack.png', badge:'home',
    name:{de:'7-Tage Home-Kit',en:'7-Day Home Kit'},
    desc:{de:'Trinkwasser, Langzeitnahrung und Stromversorgung für eine Woche zu Hause.',en:'Drinking water, long-life food and power backup for a full week at home.'},
    coversCats:['01','02','08'], anchor:'#home-kit',
  },
  'TK-ACC-DOCBAG': {
    sku:'TK-ACC-DOCBAG', price:'€29.99', img:'assets/img/document-bag-2.png', badge:null,
    name:{de:'Wasserdichte Dokumententasche',en:'Waterproof Document Bag'},
    desc:{de:'Feuerfest und wasserdicht — für Ausweis, Versicherungsunterlagen und Dokumente.',en:'Fireproof and waterproof — for ID, insurance papers and medical documents.'},
    coversCats:['06'], anchor:'#backpacks',
  },
};

// What each score.js cat covers (human-readable, for "why" copy)
const CAT_CONTEXT = {
  '01':{de:'Wasservorrat & Lebensmittel',en:'water & food supply'},
  '02':{de:'Strom & Licht',en:'power & light'},
  '03':{de:'Notfallinformation',en:'emergency information'},
  '04':{de:'Brandschutz',en:'fire safety'},
  '05':{de:'Erste Hilfe',en:'first aid'},
  '06':{de:'Dokumentenschutz',en:'document protection'},
  '07':{de:'Werkzeug & Reparatur',en:'tools & repairs'},
  '08':{de:'Hygiene',en:'hygiene'},
  '09':{de:'Notgepäck & Evakuierung',en:'go-bag & evacuation'},
  '10':{de:'Gemeinschaft & Resilienz',en:'community & resilience'},
};

/** smartRecommend — product-aware replacement for recommendKits.
 *  Returns 1-3 PRODUCTS objects, nothing at 90+. */
function smartRecommend({ categories: c, overall }) {
  if (overall >= 90) return [];
  const picks = [];

  // Go-bag / evacuation gap → backpack tier
  if (c['09'] < 50) picks.push(overall < 40 ? PRODUCTS['TK-BP-ESS'] : PRODUCTS['TK-BP-STD']);

  // Water+food AND power both weak → home kit
  if (c['01'] < 50 && c['02'] < 50) picks.push(PRODUCTS['TK-HOME-7D']);

  // Document gap not already covered by a Standard/Premium backpack
  if (c['06'] < 50 && !picks.find(p => ['TK-BP-STD','TK-BP-PRM'].includes(p.sku))) {
    picks.push(PRODUCTS['TK-ACC-DOCBAG']);
  }

  // Nothing picked yet → suggest by overall level
  if (!picks.length) {
    picks.push(overall < 50 ? PRODUCTS['TK-BP-ESS'] : PRODUCTS['TK-BP-PRM']);
  }

  // Low overall + only Essential picked → add Premium as upgrade
  if (picks.length === 1 && picks[0].sku === 'TK-BP-ESS' && overall < 50) {
    picks.push(PRODUCTS['TK-BP-PRM']);
  }

  return picks.slice(0, 3);
}

/** Build "why this product" copy from which of its covered cats are weak */
function whyCopy(product, categories, lang) {
  const weak = product.coversCats
    .filter(cat => (categories[cat] ?? 100) < 75)
    .map(cat => CAT_CONTEXT[cat]?.[lang])
    .filter(Boolean).slice(0, 3);
  if (!weak.length) return '';
  return lang === 'de'
    ? `Schließt Ihre Lücken bei: <strong>${weak.join(', ')}</strong>.`
    : `Closes your gaps in: <strong>${weak.join(', ')}</strong>.`;
}

/* ---------------- State ---------------- */
let lang = "de";
let step = -1;
let answers = new Array(QUESTIONS.length).fill(null);
let advanceTimer = null;

const stage = document.getElementById("stage");
const footerText = document.getElementById("footerText");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const progressBar = document.getElementById("progressBar");
const progressLabel = document.getElementById("progressLabel");
const progressTime = document.getElementById("progressTime");

function t(){ return UI[lang]; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("btnDE").classList.toggle("active", l==="de");
  document.getElementById("btnEN").classList.toggle("active", l==="en");
  
  // Update header/footer texts
  const u = t();
  document.getElementById("wordmarkTag").textContent = u.tag;
  const navLinks = document.querySelectorAll("#mainNav a");
  if(navLinks.length >= 3) {
    navLinks[0].textContent = u.navHome;
    navLinks[1].textContent = u.navShop;
    navLinks[2].textContent = u.navContact;
  }
  document.getElementById("footerDesc").textContent = u.footerDesc;
  document.getElementById("footerNavLabel").textContent = u.footerNav;
  document.getElementById("footerLegalLabel").textContent = u.footerLegal;
  
  render();
}

function render(){
  clearTimeout(advanceTimer);
  footerText.innerHTML = t().footer;
  if(step === -1) renderIntro();
  else if(step < QUESTIONS.length) renderQuestion(step);
  else renderResults();
}

function renderIntro(){
  progressWrap.classList.remove("visible");
  const u = t();
  stage.innerHTML = `
    <section class="screen intro">
      <p class="eyebrow">${u.eyebrow}</p>
      <h1>${u.title}</h1>
      <p class="lede">${u.lede}</p>
      <div class="facts">${u.facts.map(f=>`<span class="fact">${f}</span>`).join("")}</div>
      <button class="btn btn-primary" onclick="startCheck()">${u.start}</button>
      <p class="trust">${u.trust}</p>
      <div class="intro-areas">
        <p>${u.areasLabel}</p>
        <div class="area-chips">
          ${Object.values(CATS).map(c=>`<span>${c[lang]}</span>`).join("")}
        </div>
      </div>
    </section>`;
}

function startCheck(){
  answers = new Array(QUESTIONS.length).fill(null);
  step = 0;
  render();
  window.scrollTo({top:0});
}

function renderQuestion(i){
  const u = t();
  const q = QUESTIONS[i][lang];
  const cat = CATS[QUESTIONS[i].cat][lang];
  const n = QUESTIONS.length;

  progressWrap.classList.add("visible");
  progressLabel.textContent = u.qOf(i+1, n);
  progressTime.textContent = u.timeLeft(Math.max(1, Math.ceil((n-i)*20/60)));
  progressFill.style.width = ((i)/n*100) + "%";
  progressBar.setAttribute("aria-valuenow", i+1);
  progressBar.setAttribute("aria-label", u.qOf(i+1, n));

  stage.innerHTML = `
    <section class="screen question">
      <div class="ghost-num" aria-hidden="true">${String(i+1).padStart(2,"0")}</div>
      <p class="q-cat">${cat}</p>
      <h2 class="q-text">${esc(q.q)}</h2>
      <div class="options" role="group" aria-label="${esc(q.q)}">
        ${q.opts.map((o,oi)=>`
          <button class="option ${answers[i]===oi?"selected":""}" aria-pressed="${answers[i]===oi}"
                  onclick="selectOption(${i},${oi})">
            <span class="dot" aria-hidden="true"></span>${esc(o[0])}
          </button>`).join("")}
      </div>
      <div class="q-nav">
        ${i>0 ? `<button class="back-link" onclick="goBack()">${u.back}</button>` : ""}
      </div>
    </section>`;
}

function selectOption(qi, oi){
  answers[qi] = oi;
  const btns = stage.querySelectorAll(".option");
  btns.forEach((b,idx)=>{
    b.classList.toggle("selected", idx===oi);
    b.setAttribute("aria-pressed", idx===oi);
  });
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(()=>{
    step = qi + 1;
    render();
    window.scrollTo({top:0});
  }, 350);
}

function goBack(){
  clearTimeout(advanceTimer);
  if(step > 0){ step--; render(); }
}

function computeResults(){
  const { categories, overall } = computeScore(answers);
  const level = levelFor(overall);

  const cats = Object.keys(CATS).map(k => ({
    key: k, name: CATS[k][lang], pct: categories[k]
  }));

  const weakCats = weakestCategories(categories, 3).map(([k]) => k);
  const gaps = [];
  const seen = new Set();
  for (const catKey of weakCats) {
    const qs = QUESTIONS
      .map((q, i) => ({ i, q, pts: ANSWER_MAP[q[lang].opts[answers[i] ?? 0][1]] ?? 0 }))
      .filter(x => x.q.cat === catKey && !seen.has(x.i))
      .sort((a, b) => a.pts - b.pts || a.q.prio - b.q.prio);
    if (qs.length) { gaps.push(qs[0]); seen.add(qs[0].i); }
    if (gaps.length === 3) break;
  }

  const kits = smartRecommend({ categories, overall });
  const legacyScore = Math.round((overall / 100) * TOTAL_MAX);
  return { overall, legacyScore, level, cats, gaps, kits, categories };
}

function renderResults(){
  const u = t();
  const r = computeResults();
  progressWrap.classList.remove("visible");

  const C = 2 * Math.PI * 88;

  // ── Category bars (score.js: pct 0-100 per category) ────────────────────
  // Weakest category = lowest pct
  const minPct = Math.min(...r.cats.map(c => c.pct));

  const catsHTML = r.cats.map(c => {
    const isWeak = c.pct === minPct && c.pct < 100;
    const colourVar = c.pct < 50 ? 'var(--brand-red)' : c.pct < 75 ? '#f59e0b' : 'var(--status-green)';
    return `
    <div class="cat-row ${isWeak ? 'weak' : ''}">
      <div class="cat-head">
        <span class="cat-name">${c.name}</span>
        <span class="cat-pct" style="color:${colourVar}">${isWeak ? (lang==='de'?'Kritisch':'Critical') + ' · ' : ''}${c.pct}%</span>
      </div>
      <div class="cat-track">
        <div class="cat-fill" data-w="${c.pct}" style="background:${colourVar}"></div>
      </div>
    </div>`;
  }).join('');

  // ── Next steps: gap questions + FREE_ACTIONS ─────────────────────────────
  const stepsHTML = r.gaps.length
    ? r.gaps.map((g, idx) => {
        const q = QUESTIONS[g.i];
        const rec = q[lang].reco;
        const free = FREE_ACTIONS[g.i] || null;
        return `
        <div class="step-card">
          <div class="step-num">${String(idx+1).padStart(2,'0')}</div>
          <div class="step-body">
            <h3>${rec.h}</h3>
            <p>${rec.p}</p>
            ${free ? `<div class="free-action">
              <span class="free-label">${lang==='de'?'Kostenlos jetzt':'Free right now'}</span>
              ${esc(free[lang])}
            </div>` : ''}
            ${q.shop ? `<a class="step-shop" href="${SHOP_URL}" target="_blank" rel="noopener">${u.shopLink}</a>` : ''}
          </div>
        </div>`;
      }).join('')
    : `<div class="perfect-card"><h3>${u.perfectTitle}</h3><p>${u.perfectText}</p></div>`;


  requestAnimationFrame(() => {
    const ring = document.getElementById('ringFg');
    // ring animates from 0% → overall%
    ring.style.strokeDashoffset = C - (C * r.overall / 100);
    stage.querySelectorAll('.cat-fill').forEach(f => { f.style.width = f.dataset.w + '%'; });

    const numEl = document.getElementById('scoreNum');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { numEl.textContent = r.overall; return; }
    const start = performance.now(), dur = 1000;
    (function tick(now) {
      const p = Math.min(1, (now - start) / dur);
      numEl.textContent = Math.round(r.overall * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    })(start);
  });
  window.scrollTo({ top: 0 });

  // ── Pop up product recommendations after 1.5 s ──────────────────────────
  clearTimeout(_recModalTimer);
  _recModalTimer = setTimeout(() => openRecModal(r.kits, r.categories, r.overall), 1500);
}

function shareResult(overall){
  const u = t();
  const level = levelFor(overall)[lang].name;
  const score = overall; // share as percentage
  const text = u.shareText(score, 100, level);
  const url = location.href;
  if(navigator.share){
    navigator.share({title:"takeKONTROL Score", text, url}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(text+" "+url).then(()=>{
      const b = document.getElementById("shareBtn");
      const old = b.textContent; b.textContent = u.copied;
      setTimeout(()=>b.textContent = old, 1600);
    });
  }
}

// ── Rec product: add to cart (shared localStorage key with shop) ─────────────
function recAddToCart(btn) {
  const sku  = btn.dataset.sku;
  const name = btn.dataset.name;
  const price = parseFloat(btn.dataset.price) || 0;
  if (!sku) return;

  // Read existing cart
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('tk_cart') || '[]'); } catch(e) {}

  const existing = cart.find(i => i.sku === sku);
  if (existing) { existing.qty++; }
  else { cart.push({ sku, name, price, qty: 1 }); }
  localStorage.setItem('tk_cart', JSON.stringify(cart));

  // Toast feedback
  const msg = lang === 'de'
    ? `✓ ${name} wurde hinzugefügt`
    : `✓ ${name} added to cart`;
  let toast = document.getElementById('recToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'recToast';
    toast.style.cssText = [
      'position:fixed','bottom:24px','right:24px','z-index:9999',
      'padding:12px 20px','background:#111','color:#fff',
      'border-radius:10px','font-size:14px','font-weight:600',
      'box-shadow:0 8px 32px rgba(0,0,0,.35)',
      'transform:translateY(20px) scale(.95)','opacity:0',
      'transition:all .25s ease','pointer-events:none',
    ].join(';');
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateY(0) scale(1)';
    clearTimeout(toast._tid);
    toast._tid = setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(20px) scale(.95)';
    }, 2400);
  });

  // Also navigate to shop after short delay
  btn.textContent = lang === 'de' ? '✓ Hinzugefügt' : '✓ Added';
  btn.style.background = 'var(--status-green)';
  btn.style.pointerEvents = 'none';
}


// ── Product recommendation modal ─────────────────────────────────────────────
let _recModalTimer = null;

function openRecModal(kits, categories, overallPct) {
  if (!kits || !kits.length) return;
  const overlay = document.getElementById('rec-modal-overlay');
  const body    = document.getElementById('recModalBody');
  const title   = document.getElementById('recModalTitle');
  const sub     = document.getElementById('recModalSub');
  const footer  = document.getElementById('recModalFooter');
  if (!overlay) return;

  const u = t();
  title.textContent = lang === 'de' ? 'Empfohlen für Sie' : 'Recommended for you';
  sub.textContent   = lang === 'de'
    ? 'Basierend auf Ihren Antworten — gezielt auf Ihre Lücken abgestimmt.'
    : 'Based on your answers — targeted to close exactly your gaps.';

  const tierLabel = { essential:{de:'Essential',en:'Essential'}, standard:{de:'Standard',en:'Standard'}, premium:{de:'Premium',en:'Premium'}, home:{de:'Home',en:'Home'} };
  const pickLabel = lang === 'de' ? 'Unser Tipp' : 'Top Pick';

  body.innerHTML = kits.map((p, idx) => {
    const why = whyCopy(p, categories, lang);
    const tier = p.badge ? tierLabel[p.badge][lang] : '';
    return `
    <div class="rec-card" ${idx === 0 ? `data-pick="${pickLabel}"` : ''}>
      <div class="rec-card__img">
        <img src="${p.img}" alt="${p.name[lang]}" onerror="this.style.display='none'">
      </div>
      <div class="rec-card__body">
        ${tier ? `<span class="rec-card__tier">${tier}</span>` : ''}
        <span class="rec-card__name">${p.name[lang]}</span>
        ${why ? `<p class="rec-card__why">${why}</p>` : ''}
        <div class="rec-card__foot">
          <span class="rec-card__price">${p.price}</span>
          <a class="btn btn-primary btn-small add-to-cart-btn"
             href="javascript:void(0)"
             data-sku="${p.sku}"
             data-name="${p.name[lang]}"
             data-price="${p.price.replace('€','')}"
             onclick="recAddToCart(this)">
            ${lang === 'de' ? 'In den Warenkorb' : 'Add to Cart'}
          </a>
          <a class="rec-card__view" href="${SHOP_URL}${p.anchor}" target="_blank" rel="noopener">
            ${lang === 'de' ? 'Details' : 'Details'} →
          </a>
        </div>
      </div>
    </div>`;
  }).join('');

  const shopTxt = lang === 'de'
    ? `Alle ${overallPct}%-Vorbereitung-Produkte im Shop ansehen.`
    : `See all products for your ${overallPct}% readiness score.`;
  footer.innerHTML = `<a class="rec-modal__all" href="${SHOP_URL}" target="_blank" rel="noopener">${lang === 'de' ? 'Gesamten Shop ansehen →' : 'Browse full shop →'}</a>`;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  // swipe-down to close on mobile
  let startY = 0;
  const modal = document.getElementById('rec-modal');
  modal.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  modal.addEventListener('touchend', e => {
    if (e.changedTouches[0].clientY - startY > 60) closeRecModal();
  }, { passive: true });
}

function closeRecModal() {
  const overlay = document.getElementById('rec-modal-overlay');
  if (!overlay) return;
  const modal = document.getElementById('rec-modal');
  modal.style.transform = 'translateY(100%)';
  setTimeout(() => {
    overlay.classList.remove('open');
    modal.style.transform = '';
    document.body.style.overflow = '';
  }, 320);
}

setLang("de");
</script>
