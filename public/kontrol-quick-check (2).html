    en:{q:"In an emergency, could you grab your key documents within one minute?", opts:[["No, they're scattered",0],["I'd know where everything is",1],["Bundled in one place",2],["Document folder plus digital copies",3]], reco:{h:"Set up a document folder",p:"Bundle IDs, insurance papers and key contracts in one document folder – backed by digital copies."}}
  },
  {
    cat:"flucht", prio:3, shop:true,
    de:{q:"Sie müssen in 10 Minuten das Haus verlassen: Steht ein gepacktes Notgepäck bereit?", opts:[["Nein",0],["Einzelne Dinge, nichts gepackt",1],["Teilweise gepackt",2],["Ja, komplett für 72 Stunden",3]], reco:{h:"Notfallrucksack packen",p:"Ein fertig gepackter Notfallrucksack pro Person deckt die ersten 72 Stunden ab – die kritischste Phase jeder Evakuierung."}},
    en:{q:"You have to leave the house in 10 minutes: is a packed go-bag ready?", opts:[["No",0],["A few items, nothing packed",1],["Partially packed",2],["Yes, complete for 72 hours",3]], reco:{h:"Pack a go-bag",p:"A ready-packed emergency backpack per person covers the first 72 hours – the most critical phase of any evacuation."}}
  },
  {
    cat:"info", prio:11, shop:false,
    de:{q:"Haben Sie mit Familie oder Mitbewohnern einen Plan für den Notfall?", opts:[["Nie darüber gesprochen",0],["Nur grob mal erwähnt",1],["Treffpunkt ist vereinbart",2],["Klarer Plan: Treffpunkt, Kontakte, Aufgaben",3]], reco:{h:"Notfallplan besprechen",p:"Vereinbaren Sie einen festen Treffpunkt und Notfallkontakte – 15 Minuten Gespräch genügen für den Anfang."}},
    en:{q:"Have you agreed an emergency plan with family or housemates?", opts:[["Never talked about it",0],["Mentioned it vaguely once",1],["Meeting point agreed",2],["Clear plan: meeting point, contacts, roles",3]], reco:{h:"Talk through an emergency plan",p:"Agree a fixed meeting point and emergency contacts – a 15-minute conversation is enough to start."}}
  }
];

const MAX_PER_Q = 3;
const TOTAL_MAX = QUESTIONS.length * MAX_PER_Q;

const LEVELS = [
  {min:0,  de:{name:"Setup erforderlich",  desc:"Sie starten fast bei null – die gute Nachricht: Die wichtigsten Lücken lassen sich schnell und strukturiert schließen."},
           en:{name:"Setup Required",      desc:"You're starting almost from zero – the good news: the most important gaps can be closed quickly and structurally."}},
  {min:10, de:{name:"Basisniveau",         desc:"Eine Basis ist da. Im Ernstfall gäbe es aber spürbare Lücken – Ihre nächsten Schritte zur Optimierung stehen unten."},
           en:{name:"Baseline",            desc:"You have a foundation. In a real emergency there would still be noticeable gaps – your next steps for optimization are below."}},
  {min:19, de:{name:"Fortgeschritten",     desc:"Vieles ist vorhanden. Ein paar gezielte Ergänzungen machen jetzt den entscheidenden operativen Unterschied."},
           en:{name:"Advanced",            desc:"Much is in place. A few targeted additions will now make the decisive operational difference."}},
  {min:28, de:{name:"KONTROL Status: Grün",desc:"Stark. Sie haben die kritischen Bereiche im Griff – halten Sie Systeme und Pläne aktuell."},
           en:{name:"KONTROL Status: Green",desc:"Strong. You have the critical areas under control – keep systems and plans up to date."}}
];

/* ---------------- State ---------------- */
let lang = "de";
let step = -1;
let answers = new Array(QUESTIONS.length).fill(null);
let advanceTimer = null;

const stage = document.getElementById("stage");
const footerText = document.getElementById("footerText");
const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const progressBar = document.getElementById("progressBar");
const progressLabel = document.getElementById("progressLabel");
const progressTime = document.getElementById("progressTime");

function t(){ return UI[lang]; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("btnDE").classList.toggle("active", l==="de");
  document.getElementById("btnEN").classList.toggle("active", l==="en");
  
  // Update header/footer texts
  const u = t();
  document.getElementById("wordmarkTag").textContent = u.tag;
  const navLinks = document.querySelectorAll("#mainNav a");
  if(navLinks.length >= 3) {
    navLinks[0].textContent = u.navHome;
    navLinks[1].textContent = u.navShop;
    navLinks[2].textContent = u.navContact;
  }
  document.getElementById("footerDesc").textContent = u.footerDesc;
  document.getElementById("footerNavLabel").textContent = u.footerNav;
  document.getElementById("footerLegalLabel").textContent = u.footerLegal;
  
  render();
}

function render(){
  clearTimeout(advanceTimer);
  footerText.innerHTML = t().footer;
  if(step === -1) renderIntro();
  else if(step < QUESTIONS.length) renderQuestion(step);
  else renderResults();
}

function renderIntro(){
  progressWrap.classList.remove("visible");
  const u = t();
  stage.innerHTML = `
    <section class="screen intro">
      <p class="eyebrow">${u.eyebrow}</p>
      <h1>${u.title}</h1>
      <p class="lede">${u.lede}</p>
      <div class="facts">${u.facts.map(f=>`<span class="fact">${f}</span>`).join("")}</div>
      <button class="btn btn-primary" onclick="startCheck()">${u.start}</button>
      <p class="trust">${u.trust}</p>
      <div class="intro-areas">
        <p>${u.areasLabel}</p>
        <div class="area-chips">
          ${Object.values(CATS).map(c=>`<span>${c[lang]}</span>`).join("")}
        </div>
      </div>
    </section>`;
}

function startCheck(){
  answers = new Array(QUESTIONS.length).fill(null);
  step = 0;
  render();
  window.scrollTo({top:0});
}

function renderQuestion(i){
  const u = t();
  const q = QUESTIONS[i][lang];
  const cat = CATS[QUESTIONS[i].cat][lang];
  const n = QUESTIONS.length;

  progressWrap.classList.add("visible");
  progressLabel.textContent = u.qOf(i+1, n);
  progressTime.textContent = u.timeLeft(Math.max(1, Math.ceil((n-i)*20/60)));
  progressFill.style.width = ((i)/n*100) + "%";
  progressBar.setAttribute("aria-valuenow", i+1);
  progressBar.setAttribute("aria-label", u.qOf(i+1, n));

  stage.innerHTML = `
    <section class="screen question">
      <div class="ghost-num" aria-hidden="true">${String(i+1).padStart(2,"0")}</div>
      <p class="q-cat">${cat}</p>
      <h2 class="q-text">${esc(q.q)}</h2>
      <div class="options" role="group" aria-label="${esc(q.q)}">
        ${q.opts.map((o,oi)=>`
          <button class="option ${answers[i]===oi?"selected":""}" aria-pressed="${answers[i]===oi}"
                  onclick="selectOption(${i},${oi})">
            <span class="dot" aria-hidden="true"></span>${esc(o[0])}
          </button>`).join("")}
      </div>
      <div class="q-nav">
        ${i>0 ? `<button class="back-link" onclick="goBack()">${u.back}</button>` : ""}
      </div>
    </section>`;
}

function selectOption(qi, oi){
  answers[qi] = oi;
  const btns = stage.querySelectorAll(".option");
  btns.forEach((b,idx)=>{
    b.classList.toggle("selected", idx===oi);
    b.setAttribute("aria-pressed", idx===oi);
  });
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(()=>{
    step = qi + 1;
    render();
    window.scrollTo({top:0});
  }, 350);
}

function goBack(){
  clearTimeout(advanceTimer);
  if(step > 0){ step--; render(); }
}

function computeResults(){
  let total = 0;
  const catAgg = {};
  Object.keys(CATS).forEach(k=>catAgg[k]={pts:0,max:0});

  const perQ = QUESTIONS.map((q,i)=>{
    const pts = q[lang].opts[answers[i]][1];
    total += pts;
    catAgg[q.cat].pts += pts;
    catAgg[q.cat].max += MAX_PER_Q;
    return {i, pts, prio:q.prio};
  });

  const score = total;
  const level = [...LEVELS].reverse().find(l=>score>=l.min);

  const cats = Object.keys(CATS).map(k=>({
    key:k, name:CATS[k][lang],
    pts:catAgg[k].pts, max:catAgg[k].max,
    missing:catAgg[k].max - catAgg[k].pts
  }));
  const maxMissing = Math.max(...cats.map(c=>c.missing));

  const gaps = perQ.filter(x=>x.pts<MAX_PER_Q)
                   .sort((a,b)=> a.pts-b.pts || a.prio-b.prio)
                   .slice(0,3);
  return {score, level, cats, gaps, maxMissing};
}

function renderResults(){
  const u = t();
  const r = computeResults();
  progressWrap.classList.remove("visible");

  const C = 2*Math.PI*88;

  const stepsHTML = r.gaps.length
    ? r.gaps.map((g,idx)=>{
        const q = QUESTIONS[g.i];
        const rec = q[lang].reco;
        return `
        <div class="step-card">
          <div class="step-num">${String(idx+1).padStart(2,"0")}</div>
          <div class="step-body">
            <h3>${rec.h}</h3>
            <p>${rec.p}</p>
            ${q.shop ? `<a class="step-shop" href="${SHOP_URL}" target="_blank" rel="noopener">${u.shopLink}</a>` : ""}
          </div>
        </div>`;
      }).join("")
    : `<div class="perfect-card"><h3>${u.perfectTitle}</h3><p>${u.perfectText}</p></div>`;

  stage.innerHTML = `
    <section class="screen results">
      <div class="score-hero">
        <p class="eyebrow">${u.resultEyebrow}</p>
        <div class="ring-wrap">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
            <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"
                    stroke-dasharray="${C}" stroke-dashoffset="${C}"></circle>
          </svg>
          <div class="ring-num">
            <span class="big" id="scoreNum">0</span>
            <span class="of">${u.ofPoints(TOTAL_MAX)}</span>
          </div>
        </div>
        <h1 class="level-name">${r.level[lang].name}</h1>
        <p class="level-desc">${r.level[lang].desc}</p>
      </div>

      <div class="results-body">
        <h2 class="section-title">${u.catTitle}</h2>
        ${r.cats.map(c=>{
          const isWeak = r.maxMissing>0 && c.missing===r.maxMissing;
          const barPct = Math.round(c.pts/c.max*100);
          return `
          <div class="cat-row ${isWeak?"weak":""}">
            <div class="cat-head">
              <span class="cat-name">${c.name}</span>
              <span class="cat-pct">${isWeak?u.weakTag+" · ":""}${u.catPoints(c.pts,c.max)}</span>
            </div>
            <div class="cat-track"><div class="cat-fill" data-w="${barPct}"></div></div>
          </div>`;
        }).join("")}

        <div class="steps">
          <h2 class="section-title">${u.stepsTitle}</h2>
          ${stepsHTML}
        </div>

        <div class="shop-cta">
          <h2>${u.ctaTitle}</h2>
          <p>${u.ctaText}</p>
          <a class="btn btn-primary" href="${SHOP_URL}" target="_blank" rel="noopener">${u.ctaBtn}</a>
        </div>

        <div class="result-actions">
          <button class="btn btn-ghost" onclick="startCheck()">${u.restart}</button>
          <button class="btn btn-ghost" id="shareBtn" onclick="shareResult(${r.score})">${u.share}</button>
        </div>
      </div>
    </section>`;

  requestAnimationFrame(()=>{
    const ring = document.getElementById("ringFg");
    ring.style.strokeDashoffset = C - (C * r.score/TOTAL_MAX);
    stage.querySelectorAll(".cat-fill").forEach(f=>{ f.style.width = f.dataset.w + "%"; });

    const numEl = document.getElementById("scoreNum");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){ numEl.textContent = r.score; return; }
    const start = performance.now(), dur = 1000;
    (function tick(now){
      const p = Math.min(1,(now-start)/dur);
      numEl.textContent = Math.round(r.score * (1-Math.pow(1-p,3)));
      if(p<1) requestAnimationFrame(tick);
    })(start);
  });
  window.scrollTo({top:0});
}

function shareResult(score){
  const u = t();
  const level = [...LEVELS].reverse().find(l=>score>=l.min)[lang].name;
  const text = u.shareText(score, TOTAL_MAX, level);
  const url = location.href;
  if(navigator.share){
    navigator.share({title:"takeKONTROL Score", text, url}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(text+" "+url).then(()=>{
      const b = document.getElementById("shareBtn");
      const old = b.textContent; b.textContent = u.copied;
      setTimeout(()=>b.textContent = old, 1600);
    });
  }
}

setLang("de");
</script>
